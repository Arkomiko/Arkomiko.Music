-linejoin="round" stroke-linecap="round" /></g></g><g class="q q2"><g transform="translate(144.00 162.00) rotate(16.00) scale(0.760)" ><path d="M-9.00 -16.00 L-3.00 -24.00 L7.00 -24.00 L12.00 -17.00 L12.00 -9.00 L2.00 -2.00 L2.00 5.00" fill="none" stroke="#B3307C" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M2.00 11.00 L5.50 14.50 L2.00 18.00 L-1.50 14.50 Z" fill="#B3307C" stroke="#B3307C" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round" /></g></g></svg>